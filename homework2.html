<!doctype html>
<html lang="zh-TW" class="h-full">
 <head><script src="/_sdk/telemetry_sdk.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>互動月曆聯絡簿</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .day-cell { transition: all 0.15s ease; }
        .day-cell:hover { transform: scale(1.08); }
        .day-cell.selected { background-color: var(--primary); color: white; }
        .day-cell.has-content::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
        }
        .toast {
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 1.7s forwards;
        }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; } }
    </style>
  <style>body { box-sizing: border-box; }</style>
 </head>
 <body class="h-full bg-slate-50 overflow-auto">
  <div class="h-full w-full p-4 md:p-6"><!-- Header -->
   <header id="app-header" class="rounded-xl bg-gradient-to-r from-blue-500 to-blue-600 text-white text-center py-4 px-6 mb-5 shadow-md">
    <h1 id="header-title" class="text-xl font-bold m-0">🎒互動月曆聯絡簿</h1>
   </header><!-- Access Code Modal -->
   <div id="access-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-[9999] flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-2xl p-8 max-w-sm w-full mx-4">
     <h2 class="text-2xl font-bold text-center mb-2 text-slate-700">🔐 老師驗證</h2>
     <p class="text-center text-slate-600 text-sm mb-6">請輸入驗證碼以進行編輯</p><input type="password" id="access-code-input" placeholder="輸入驗證碼" class="w-full p-3 border-2 border-slate-200 rounded-lg text-lg text-center mb-4 font-mono focus:outline-none focus:border-blue-500 transition" onkeyup="handleAccessKeyup(event)"> <button onclick="checkAccessCode()" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-lg font-bold transition">驗證</button>
     <p class="text-center text-slate-500 text-xs mt-4">💡 提示：驗證碼為 4 位數字</p>
    </div>
   </div>
   <div class="grid grid-cols-1 md:grid-cols-2 gap-5 max-w-[1200px] mx-auto"><!-- Calendar -->
    <div class="bg-white rounded-xl shadow-sm p-5">
     <div class="flex justify-between items-center mb-4"><button onclick="changeMonth(-1)" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-medium transition">◀ 上個月</button>
      <h3 id="calendar-title" class="text-base font-bold text-slate-700 m-0"></h3><button onclick="changeMonth(1)" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-medium transition">下個月 ▶</button>
     </div>
     <div id="calendar-grid" class="grid grid-cols-7 gap-1.5 text-center"></div>
     <div class="mt-4 text-center text-slate-700">
      <p class="text-sm font-bold"><strong>(( 點選日期，可參閱當天的作業內容 ))</strong></p>
     </div>
    </div><!-- Details -->
    <div class="bg-white rounded-xl shadow-sm p-5">
     <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-bold text-blue-500 border-b-2 border-slate-100 pb-2 mt-0 mb-0 flex-1">📝 聯絡事項詳情</h2><button onclick="openFullscreenBlackboard()" class="ml-3 px-3 py-1.5 bg-slate-700 hover:bg-slate-800 text-white rounded-lg text-sm font-medium transition flex items-center gap-1.5"> <i data-lucide="maximize-2" style="width: 16px; height: 16px;"></i> 全螢幕 </button>
     </div>
     <div id="selected-date-label" class="text-amber-600 font-bold mb-2">
      請選擇日期
     </div>
     <div id="info-display" class="bg-slate-50 p-4 rounded-lg min-h-[80px] whitespace-pre-line border-l-4 border-blue-400 text-sm mb-4">
      點擊左側日期，即可查看當日作業與通知。
     </div>
     <hr class="border-slate-100 my-4"><!-- Tabs -->
     <div class="flex gap-2 mb-3 border-b border-slate-200">
      <button onclick="switchTab('edit')" id="tab-edit" class="px-3 py-2 text-sm font-medium border-b-2 border-blue-500 text-blue-600 transition">✏️ 編輯</button> <button onclick="switchTab('search')" id="tab-search" class="px-3 py-2 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition">🔍 搜尋</button> <button onclick="switchTab('list')" id="tab-list" class="px-3 py-2 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition">📋 清單</button>
     </div><!-- Edit Tab -->
     <div id="tab-edit-content" class="tab-content">
      <h3 class="text-sm text-slate-500 font-medium mt-0 mb-2">🛠️ 老師編輯區</h3>
      <div id="edit-locked-message" class="hidden bg-amber-50 border-l-4 border-amber-400 p-3 mb-3 rounded text-sm text-amber-700">
       🔒 請先完成驗證才能編輯。點擊下方按鈕重新驗證。
      </div><button onclick="showAccessModal()" id="unlock-btn" class="hidden w-full bg-amber-500 hover:bg-amber-600 text-white py-2 rounded-lg font-medium mb-3 transition">🔓 驗證身份</button>
      <div id="edit-content-main" class="hidden">
       <label class="text-xs text-slate-500 mb-1 block">✨ 快速鍵入常用作業項目：</label> <select id="quick-select" onchange="insertPreset()" class="w-full p-2 border border-slate-200 rounded-lg text-sm mb-3 bg-white"> <option value="" disabled selected>-- 請選擇要帶入的項目 --</option> <option value="英文A本">📝 英文A本</option> <option value="英文B本">📝 英文B本</option> <option value="甲本第 頁">📝 國語甲本</option> <option value="乙本第 頁">📝 國語乙本</option> <option value="國習第 頁">📝 國語習作</option> <option value="國練第 頁">📝 國語練習簿</option> <option value="成語()">📝 成語練習</option> <option value="數練第 頁">📝 數學隨堂練習本</option> <option value="數習第 頁">📝 數學習作</option> <option value="小無敵第 頁">📝 數學作業簿</option> <option value="社練第 頁">📝 社會作業簿</option> <option value="自練第 頁">📝 自然作業簿</option> <option value="數卷第 回">📝 數學複習卷</option> <option value="自卷第 回">📝 自然複習卷</option> <option value="社卷第 回">📝 社會複習卷</option> <option value="閱讀30min">📚 閱讀30min</option> </select> <textarea id="info-input" class="w-full h-28 p-3 border border-slate-200 rounded-lg text-sm resize-none mb-3" placeholder="請輸入今日作業、重要提醒事項..."></textarea> <button onclick="saveData()" id="save-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-2.5 rounded-lg font-medium transition">儲存此日聯絡事項</button>
      </div>
     </div><!-- Search Tab -->
     <div id="tab-search-content" class="tab-content hidden">
      <h3 class="text-sm text-slate-500 font-medium mt-0 mb-2">🔍 搜尋作業</h3><input type="text" id="search-input" placeholder="輸入關鍵字搜尋..." class="w-full p-2 border border-slate-200 rounded-lg text-sm mb-3" onkeyup="performSearch()">
      <div id="search-results" class="text-sm text-slate-600 max-h-64 overflow-y-auto">
       輸入關鍵字以搜尋相關作業...
      </div>
     </div><!-- List Tab -->
     <div id="tab-list-content" class="tab-content hidden">
      <h3 class="text-sm text-slate-500 font-medium mt-0 mb-2">📋 本月作業清單</h3>
      <div class="flex gap-2 mb-3">
       <div class="text-xs text-slate-500">
        📊 統計：<span id="stats-count" class="font-bold text-blue-600">0</span> 天有作業
       </div>
      </div>
      <div id="list-content" class="text-sm text-slate-600 max-h-64 overflow-y-auto space-y-2">
       點擊上方的月份導航按鈕以切換月份，該月的作業清單將在此顯示。
      </div>
     </div>
    </div>
   </div><!-- Toast -->
   <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50"></div><!-- Fullscreen Blackboard Modal -->
   <div id="blackboard-modal" class="hidden fixed inset-0 bg-black z-[999] flex items-center justify-center" style="background: linear-gradient(135deg, #1a5d2a 0%, #2d7a3a 50%, #1a5d2a 100%); background-size: 100% 100%;">
    <div class="absolute top-4 right-4 flex gap-2">
     <button onclick="closeFullscreenBlackboard()" class="bg-white hover:bg-slate-200 text-black px-4 py-2 rounded-lg font-bold text-lg transition">✕ 關閉</button>
    </div>
    <div id="blackboard-content" class="text-5xl font-bold text-yellow-100 text-right p-20 overflow-auto" style="writing-mode: vertical-rl; text-orientation: mixed; direction: rtl; line-height: 2; word-spacing: 0.5em; letter-spacing: 0.15em; font-family: 'Noto Sans TC', serif; max-height: 100vh; max-width: 100vw; white-space: pre-wrap; word-break: break-word;">
     黑板內容
    </div>
   </div>
  </div>
  <script>
    let currentDate = new Date();
    let selectedDateStr = "";
    let allData = [];
    let isAuthenticated = false;
    const ACCESS_CODE = "1217";

    // Data SDK
    const dataHandler = {
        onDataChanged(data) {
            allData = data;
            renderCalendar();
            if (selectedDateStr) {
                updateDisplay();
            }
        }
    };

    (async () => {
        const res = await window.dataSdk.init(dataHandler);
        if (!res.isOk) console.error("Data SDK init failed");

        // Element SDK
        const defaultConfig = {
            header_title: "🎒互動月曆聯絡簿",
            primary_color: "#3b82f6",
            surface_color: "#ffffff",
            text_color: "#334155",
            accent_color: "#f59e0b",
            button_color: "#10b981",
            font_family: "Noto Sans TC",
            font_size: 14
        };

        window.elementSdk.init({
            defaultConfig,
            onConfigChange: async (config) => {
                document.getElementById('header-title').textContent = config.header_title || defaultConfig.header_title;
                const primary = config.primary_color || defaultConfig.primary_color;
                document.documentElement.style.setProperty('--primary', primary);
                document.getElementById('app-header').style.background = `linear-gradient(to right, ${primary}, ${primary}dd)`;

                const font = config.font_family || defaultConfig.font_family;
                document.body.style.fontFamily = `${font}, sans-serif`;

                const size = config.font_size || defaultConfig.font_size;
                document.body.style.fontSize = `${size}px`;
            },
            mapToCapabilities: (config) => ({
                recolorables: [
                    { get: () => config.primary_color || defaultConfig.primary_color, set: (v) => { config.primary_color = v; window.elementSdk.setConfig({ primary_color: v }); } },
                    { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
                    { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
                    { get: () => config.accent_color || defaultConfig.accent_color, set: (v) => { config.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); } },
                    { get: () => config.button_color || defaultConfig.button_color, set: (v) => { config.button_color = v; window.elementSdk.setConfig({ button_color: v }); } }
                ],
                borderables: [],
                fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
                fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
            }),
            mapToEditPanelValues: (config) => new Map([
                ["header_title", config.header_title || defaultConfig.header_title]
            ])
        });

        renderCalendar();
        selectDate(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate());
        updateEditUI();
    })();

    function getContentForDate(dateStr) {
        const record = allData.find(d => d.date_key === dateStr);
        return record ? record.content : "";
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        document.getElementById('calendar-title').innerText = `${year}年 ${month + 1}月`;

        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = "";

        const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
        weekdays.forEach(w => {
            const div = document.createElement('div');
            div.className = 'text-xs font-bold text-slate-500 py-1';
            div.innerText = w;
            grid.appendChild(div);
        });

        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDayIndex; i++) {
            grid.appendChild(document.createElement('div'));
        }

        for (let day = 1; day <= totalDays; day++) {
            const div = document.createElement('div');
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            div.className = 'day-cell relative py-2 rounded-lg cursor-pointer text-sm font-medium bg-slate-50';
            div.innerText = day;
            div.dataset.date = dateStr;

            if (getContentForDate(dateStr)) div.classList.add('has-content');
            if (dateStr === selectedDateStr) div.classList.add('selected');

            div.onclick = () => selectDate(year, month, day);
            grid.appendChild(div);
        }
    }

    function changeMonth(dir) {
        currentDate.setMonth(currentDate.getMonth() + dir);
        renderCalendar();
    }

    function selectDate(year, month, day) {
        selectedDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        document.getElementById('selected-date-label').innerText = `📅 ${year} 年 ${month + 1} 月 ${day} 日`;
        updateDisplay();
        renderCalendar();
        document.getElementById('quick-select').selectedIndex = 0;
    }

    function updateDisplay() {
        const content = getContentForDate(selectedDateStr);
        document.getElementById('info-display').innerText = content || "🎉 本日尚無聯絡事項或作業。";
        document.getElementById('info-input').value = content;
    }

    function insertPreset() {
        const sel = document.getElementById('quick-select');
        const input = document.getElementById('info-input');
        if (sel.value) {
            input.value = input.value.trim() ? input.value + "\n" + sel.value : sel.value;
            input.focus();
            sel.selectedIndex = 0;
        }
    }

    function showAccessModal() {
        document.getElementById('access-modal').classList.remove('hidden');
        document.getElementById('access-code-input').focus();
    }

    function handleAccessKeyup(e) {
        if (e.key === 'Enter') {
            checkAccessCode();
        }
    }

    function checkAccessCode() {
        const input = document.getElementById('access-code-input');
        const code = input.value.trim();

        if (code === ACCESS_CODE) {
            isAuthenticated = true;
            document.getElementById('access-modal').classList.add('hidden');
            input.value = '';
            updateEditUI();
            showToast('✅ 驗證成功！');
        } else {
            input.value = '';
            showToast('❌ 驗證碼錯誤，請重試');
            input.focus();
        }
    }

    function updateEditUI() {
        const lockMsg = document.getElementById('edit-locked-message');
        const unlockBtn = document.getElementById('unlock-btn');
        const editMain = document.getElementById('edit-content-main');

        if (isAuthenticated) {
            lockMsg.classList.add('hidden');
            unlockBtn.classList.add('hidden');
            editMain.classList.remove('hidden');
        } else {
            lockMsg.classList.remove('hidden');
            unlockBtn.classList.remove('hidden');
            editMain.classList.add('hidden');
        }
    }

    function showToast(msg) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast bg-emerald-500 text-white px-5 py-2.5 rounded-lg shadow-lg text-sm font-medium';
        toast.textContent = msg;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    async function saveData() {
        if (!isAuthenticated) {
            showToast('🔒 請先驗證身份才能編輯');
            showAccessModal();
            return;
        }

        const text = document.getElementById('info-input').value.trim();
        const btn = document.getElementById('save-btn');
        btn.disabled = true;
        btn.textContent = "儲存中...";

        const existing = allData.find(d => d.date_key === selectedDateStr);

        let result;
        if (text === "" && existing) {
            result = await window.dataSdk.delete(existing);
        } else if (text !== "" && existing) {
            result = await window.dataSdk.update({ ...existing, content: text });
        } else if (text !== "") {
            if (allData.length >= 999) {
                showToast("⚠️ 已達資料上限 999 筆，請先刪除舊資料");
                btn.disabled = false;
                btn.textContent = "儲存此日聯絡事項";
                return;
            }
            result = await window.dataSdk.create({ date_key: selectedDateStr, content: text });
        }

        btn.disabled = false;
        btn.textContent = "儲存此日聯絡事項";

        if (result && result.isOk) {
            showToast("✅ 儲存成功！");
        } else if (result && result.isError) {
            showToast("❌ 儲存失敗，請重試");
        } else if (!text && !existing) {
            showToast("✅ 已清除");
        }
    }

    lucide.createIcons();

    function openFullscreenBlackboard() {
        const content = getContentForDate(selectedDateStr) || "本日尚無聯絡事項或作業。";
        const modal = document.getElementById('blackboard-modal');
        const boardContent = document.getElementById('blackboard-content');
        
        // 將內容分行並加上編號
        const lines = content.split('\n').filter(line => line.trim() !== '');
        const formattedContent = lines.map((line, index) => {
            const num = index + 1;
            return `${num}. ${line}`;
        }).join('\n');
        
        boardContent.textContent = formattedContent;
        boardContent.style.writingMode = 'horizontal-tb';
        boardContent.style.textOrientation = 'mixed';
        boardContent.style.direction = 'ltr';
        boardContent.style.lineHeight = '1.8';
        boardContent.style.wordSpacing = 'normal';
        boardContent.style.letterSpacing = 'normal';
        boardContent.style.textAlign = 'left';
        boardContent.style.whiteSpace = 'pre-wrap';
        boardContent.style.wordBreak = 'break-word';
        
        modal.classList.remove('hidden');
        lucide.createIcons();
    }

    function closeFullscreenBlackboard() {
        document.getElementById('blackboard-modal').classList.add('hidden');
    }

    // ESC 鍵關閉黑板
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeFullscreenBlackboard();
        }
    });

    // Tab 切換功能
    function switchTab(tabName) {
        // 隱藏所有 tab 內容
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        // 移除所有 tab 按鈕的 active 狀態
        document.querySelectorAll('[id^="tab-"]').forEach(el => {
            if (el.id.startsWith('tab-') && !el.id.endsWith('-content')) {
                el.classList.remove('border-blue-500', 'text-blue-600');
                el.classList.add('border-transparent', 'text-slate-500', 'hover:text-slate-700');
            }
        });
        // 顯示選中的 tab
        document.getElementById(`tab-${tabName}-content`).classList.remove('hidden');
        document.getElementById(`tab-${tabName}`).classList.remove('border-transparent', 'text-slate-500', 'hover:text-slate-700');
        document.getElementById(`tab-${tabName}`).classList.add('border-blue-500', 'text-blue-600');

        // 當切換到清單 tab 時，更新清單
        if (tabName === 'list') {
            updateMonthlyList();
        }
    }

    // 搜尋功能
    function performSearch() {
        const keyword = document.getElementById('search-input').value.trim().toLowerCase();
        const resultsDiv = document.getElementById('search-results');

        if (!keyword) {
            resultsDiv.innerHTML = '輸入關鍵字以搜尋相關作業...';
            return;
        }

        const results = allData.filter(record => 
            record.content.toLowerCase().includes(keyword)
        );

        if (results.length === 0) {
            resultsDiv.innerHTML = '❌ 沒有符合的結果';
            return;
        }

        let html = `✅ 找到 <strong>${results.length}</strong> 筆結果：<br><br>`;
        results.forEach(record => {
            const dateObj = new Date(record.date_key + 'T00:00:00');
            const dateDisplay = dateObj.toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' });
            const preview = record.content.substring(0, 50) + (record.content.length > 50 ? '...' : '');
            html += `<div class="bg-blue-50 p-2 rounded mb-2 cursor-pointer hover:bg-blue-100 transition" onclick="selectDateFromSearch('${record.date_key}')">
                <strong>${dateDisplay}</strong><br>
                <span class="text-xs text-slate-600">${preview}</span>
            </div>`;
        });
        resultsDiv.innerHTML = html;
    }

    // 從搜尋結果選擇日期
    function selectDateFromSearch(dateStr) {
        const [year, month, day] = dateStr.split('-').map(Number);
        selectDate(year, month - 1, day);
        switchTab('edit');
    }

    // 更新月度清單
    function updateMonthlyList() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        // 找出該月份的所有資料
        const monthlyData = allData.filter(record => {
            const recordDate = new Date(record.date_key + 'T00:00:00');
            return recordDate.getFullYear() === year && recordDate.getMonth() === month;
        }).sort((a, b) => new Date(a.date_key) - new Date(b.date_key));

        const listDiv = document.getElementById('list-content');
        const statsDiv = document.getElementById('stats-count');

        if (monthlyData.length === 0) {
            listDiv.innerHTML = '📭 本月尚無作業記錄';
            statsDiv.textContent = '0';
            return;
        }

        statsDiv.textContent = monthlyData.length;
        let html = '';
        monthlyData.forEach(record => {
            const dateObj = new Date(record.date_key + 'T00:00:00');
            const dateDisplay = dateObj.toLocaleDateString('zh-TW', { weekday: 'short', month: '2-digit', day: '2-digit' });
            const preview = record.content.substring(0, 60) + (record.content.length > 60 ? '...' : '');
            html += `<div class="bg-slate-100 p-3 rounded cursor-pointer hover:bg-slate-200 transition border-l-4 border-blue-400" onclick="selectDateFromSearch('${record.date_key}')">
                <div class="font-bold text-slate-700">${dateDisplay}</div>
                <div class="text-xs text-slate-600 mt-1">${preview}</div>
            </div>`;
        });
        listDiv.innerHTML = html;
    }
  </script>
