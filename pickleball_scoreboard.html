<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>匹克球記分板 Pickleball Scoreboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti for Victory Effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pbDark: '#0b0f19',
                        pbCard: '#1e293b',
                        pbNeon: '#ccff00',
                        pbCyan: '#06b6d4',
                        pbAmber: '#f59e0b',
                        pbRose: '#f43f5e'
                    }
                }
            }
        }
    </script>

    <style>
        html, body {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior: none;
            overflow: hidden;
            height: 100%;
            width: 100%;
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        /* 卡牌等高等寬與位移轉場動畫 */
        .equal-card {
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.3s ease, background-color 0.3s ease;
            will-change: transform;
            touch-action: none;
        }

        /* 隊伍交換動畫特效 */
        .card-swap-anim {
            animation: swapGlow 0.4s ease-in-out;
        }

        @keyframes swapGlow {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(0.95); filter: brightness(1.3); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        /* 巨型阿拉伯數字字體：極致占比 */
        .huge-number {
            font-size: clamp(7rem, 24vw, 17rem);
            line-height: 0.85;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
        }

        .shadow-neon {
            text-shadow: 0 0 30px rgba(204, 255, 0, 0.4);
        }

        .shadow-cyan {
            text-shadow: 0 0 30px rgba(6, 182, 212, 0.4);
        }

        .shadow-amber {
            text-shadow: 0 0 30px rgba(245, 158, 11, 0.4);
        }

        /* Deuce 閃爍動畫 */
        @keyframes deucePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.02); }
        }
        .deuce-banner {
            animation: deucePulse 1.5s infinite ease-in-out;
            background: linear-gradient(90deg, #f97316, #eab308, #f97316);
            background-size: 200% 100%;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen justify-between p-3 sm:p-5 select-none relative">

    <header class="w-full flex flex-col items-center z-10 space-y-2">
        <div class="w-full max-w-6xl flex items-center justify-between px-1">
            <!-- LOGO 與作者標題 -->
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-pbNeon flex items-center justify-center text-pbDark font-extrabold text-base shadow-lg shadow-pbNeon/20">
                    <i class="fa-solid fa-table-tennis-paddle-ball text-slate-950"></i>
                </div>
                <h1 class="text-base sm:text-xl font-black tracking-wider text-white flex items-center gap-1.5 flex-wrap">
                    PICKLEBALL <span class="text-[11px] sm:text-xs px-2 py-0.5 rounded bg-pbNeon/20 text-pbNeon font-semibold border border-pbNeon/30">計分板(made by 家維)</span>
                </h1>
            </div>

            <!-- 右側控制按鈕組 -->
            <div class="flex items-center space-x-2">
                <!-- 音效按鈕 -->
                <button id="soundToggleBtn" onclick="toggleSound()" class="glass-panel p-2.5 rounded-xl hover:bg-slate-700/50 active:scale-95 transition text-slate-300 hover:text-pbNeon" title="開關音效">
                    <i id="soundIcon" class="fa-solid fa-volume-high text-base sm:text-lg"></i>
                </button>
                <!-- 新一局按鈕 -->
                <button onclick="confirmReset()" class="glass-panel px-3.5 py-2 rounded-xl hover:bg-slate-700/50 active:scale-95 transition text-pbNeon hover:text-lime-300 flex items-center gap-1.5 font-bold text-xs sm:text-sm" title="開啟新一局">
                    <i class="fa-solid fa-arrow-rotate-right text-base"></i>
                    <span>新一局</span>
                </button>
            </div>
        </div>

        <!-- 頂部提示條 / 呼叫比數提示 (Server-Score-Receiver-Score-Server#) -->
        <div id="statusBanner" class="w-full max-w-6xl min-h-[32px] flex items-center justify-center">
            <div id="deuceBadge" class="hidden deuce-banner text-slate-950 font-black px-5 py-1 rounded-full text-xs sm:text-sm tracking-widest uppercase shadow-lg shadow-orange-500/20">
                <i class="fa-solid fa-fire mr-1"></i> DEUCE 平分戰（需領先 2 分獲勝）
            </div>
            <div id="gameNoticeBadge" class="glass-panel text-slate-300 font-medium px-4 py-1 rounded-full text-xs tracking-wider border border-slate-700/50 flex items-center gap-2">
                <span class="text-pbNeon font-bold flex items-center gap-1">
                    <i class="fa-solid fa-bullhorn"></i> 比數呼叫: <span id="calloutText" class="underline tracking-widest text-white ml-1">0 - 0 - 2</span>
                </span>
                <span class="text-slate-600">|</span>
                <span class="text-slate-400">左卡發球方得分，右卡換位</span>
            </div>
        </div>
    </header>

    <main class="w-full max-w-6xl my-auto flex-1 flex items-center justify-center py-2">
        <div class="grid grid-cols-3 gap-3 sm:gap-6 w-full h-[68vh] max-h-[600px] min-h-[380px]">
            
            <!-- 牌卡 1（左）：固定為「發球方 Serving Team」 -->
            <div id="cardServing" class="equal-card bg-slate-800/90 rounded-2xl sm:rounded-3xl border-2 border-pbNeon/60 flex flex-col justify-between p-3 sm:p-5 relative overflow-hidden select-none cursor-grab active:cursor-grabbing">
                <!-- 頂部區 -->
                <div class="w-full flex items-center justify-between z-10">
                    <div class="flex flex-col">
                        <span class="text-[10px] font-extrabold text-pbNeon tracking-widest flex items-center gap-1">
                            <i class="fa-solid fa-table-tennis-paddle-ball text-xs animate-pulse"></i> 發球方 SERVING
                        </span>
                        <button onclick="editServingTeamName()" class="group flex items-center gap-1.5 text-slate-200 hover:text-white font-black text-sm sm:text-lg transition truncate max-w-[120px] sm:max-w-[180px]">
                            <span id="servingTeamName" class="truncate">隊伍 1</span>
                            <i class="fa-solid fa-pen text-xs opacity-0 group-hover:opacity-100 text-pbNeon transition"></i>
                        </button>
                    </div>
                    <span id="servingTeamBadge" class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-pbNeon/20 text-pbNeon border border-pbNeon/40">T1</span>
                </div>

                <!-- 中央巨型數字 -->
                <div class="flex-1 flex items-center justify-center my-auto">
                    <span id="servingScore" class="huge-number text-pbNeon shadow-neon">0</span>
                </div>

                <!-- 底部手勢提示 -->
                <div class="w-full flex justify-between items-center text-[10px] sm:text-xs text-slate-400 font-medium pointer-events-none border-t border-slate-700/50 pt-2">
                    <span class="flex items-center text-pbNeon font-bold"><i class="fa-solid fa-arrow-up mr-1"></i>上滑 +1 分</span>
                    <span class="flex items-center text-red-400"><i class="fa-solid fa-arrow-down mr-1"></i>下滑 -1</span>
                </div>
            </div>

            <!-- 牌卡 2（中間）：固定為「接發球方 Receiving Team」 -->
            <div id="cardReceiving" class="equal-card bg-slate-800/90 rounded-2xl sm:rounded-3xl border-2 border-pbCyan/40 flex flex-col justify-between p-3 sm:p-5 relative overflow-hidden select-none cursor-grab active:cursor-grabbing">
                <!-- 頂部區 -->
                <div class="w-full flex items-center justify-between z-10">
                    <div class="flex flex-col">
                        <span class="text-[10px] font-extrabold text-pbCyan tracking-widest">接發球 RECEIVING</span>
                        <button onclick="editReceivingTeamName()" class="group flex items-center gap-1.5 text-slate-200 hover:text-white font-black text-sm sm:text-lg transition truncate max-w-[120px] sm:max-w-[180px]">
                            <span id="receivingTeamName" class="truncate">隊伍 2</span>
                            <i class="fa-solid fa-pen text-xs opacity-0 group-hover:opacity-100 text-pbCyan transition"></i>
                        </button>
                    </div>
                    <span id="receivingTeamBadge" class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-pbCyan/20 text-pbCyan border border-pbCyan/40">T2</span>
                </div>

                <!-- 中央巨型數字 -->
                <div class="flex-1 flex items-center justify-center my-auto">
                    <span id="receivingScore" class="huge-number text-pbCyan shadow-cyan">0</span>
                </div>

                <!-- 底部提示 -->
                <div class="w-full flex justify-between items-center text-[10px] sm:text-xs text-slate-400 font-medium pointer-events-none border-t border-slate-700/50 pt-2">
                    <span class="flex items-center text-slate-500"><i class="fa-solid fa-lock mr-1"></i>側邊制不加分</span>
                    <span class="flex items-center text-red-400"><i class="fa-solid fa-arrow-down mr-1"></i>下滑 -1</span>
                </div>
            </div>

            <!-- 牌卡 3（右邊）：發球位 1 / 2 （點擊觸發 Side-Out 換位） -->
            <div id="cardServerState" class="equal-card bg-slate-800/90 rounded-2xl sm:rounded-3xl border-2 border-pbAmber/50 flex flex-col justify-between p-3 sm:p-5 relative overflow-hidden select-none cursor-pointer transition active:scale-95 bg-gradient-to-b from-slate-800 via-slate-800 to-slate-900">
                <!-- 發球位標題頂部區 -->
                <div class="w-full flex items-center justify-between z-10">
                    <span class="text-xs sm:text-base font-black tracking-wider text-pbAmber uppercase">發球位</span>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-pbAmber/10 text-pbAmber border border-pbAmber/30">SERVER</span>
                </div>

                <!-- 中央巨型數字 (預設顯現為 2) -->
                <div class="flex-1 flex flex-col items-center justify-center my-auto">
                    <span id="serverStateDigit" class="huge-number text-pbAmber shadow-amber">2</span>
                </div>

                <!-- 底部切換提示 -->
                <div class="w-full flex justify-center items-center text-[10px] sm:text-xs text-pbAmber font-bold pointer-events-none border-t border-slate-700/50 pt-2">
                    <i class="fa-solid fa-hand-pointer mr-1"></i> 點擊 2 ➔ 1 換球權
                </div>
            </div>

        </div>
    </main>

    <!-- 頁尾規則說明 -->
    <footer class="w-full max-w-6xl mx-auto flex items-center justify-center px-2 pt-1 pb-1">
        <div class="text-xs text-slate-400 font-medium flex items-center gap-2">
            <span>規則: <strong class="text-slate-200">Side-Out 側邊得分制 (11 分且需領先 2 分)</strong></span>
        </div>
    </footer>

    <!-- 獲勝 Modal -->
    <div id="winModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center z-50 opacity-0 pointer-events-none transition-all duration-300 p-4">
        <div class="glass-panel border-2 border-pbNeon/50 rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl transform scale-90 transition-all duration-300" id="winModalCard">
            <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-pbNeon/20 border-2 border-pbNeon flex items-center justify-center text-pbNeon text-4xl shadow-xl shadow-pbNeon/20">
                <i class="fa-solid fa-trophy animate-bounce"></i>
            </div>
            
            <h2 class="text-xs font-bold text-pbNeon tracking-widest uppercase mb-1">Match Complete</h2>
            <h3 id="winnerText" class="text-2xl sm:text-3xl font-black text-white mb-2">隊伍 1 獲勝！</h3>
            
            <div class="bg-slate-900/80 rounded-2xl p-4 my-4 border border-slate-800 text-slate-300">
                <div class="text-xs text-slate-400 mb-1">最終比分</div>
                <div id="finalScoreText" class="text-4xl font-black text-white tracking-wider">11 : 9</div>
            </div>

            <div class="flex gap-3 mt-6">
                <button onclick="closeWinModal()" class="flex-1 py-3 px-4 rounded-xl font-bold text-xs text-slate-400 hover:text-white glass-panel hover:bg-slate-700/50 transition">
                    檢視記分板
                </button>
                <button onclick="resetMatch(); closeWinModal();" class="flex-1 py-3 px-4 rounded-xl font-bold text-xs text-slate-950 bg-pbNeon hover:bg-lime-300 transition shadow-lg shadow-pbNeon/20">
                    開始新一局
                </button>
            </div>
        </div>
    </div>

    <!-- 新一局確認 Modal -->
    <div id="resetConfirmModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center z-50 opacity-0 pointer-events-none transition-all duration-300 p-4">
        <div class="glass-panel border border-pbNeon/30 rounded-3xl p-6 max-w-xs w-full text-center shadow-2xl">
            <div class="w-12 h-12 mx-auto mb-3 rounded-full bg-pbNeon/20 text-pbNeon flex items-center justify-center text-xl">
                <i class="fa-solid fa-arrow-rotate-right"></i>
            </div>
            <h3 class="text-lg font-bold text-white mb-2">確定開始新一局？</h3>
            <p class="text-xs text-slate-400 mb-5">將會重置分數為 0-0-2，發球權回到隊伍 1。</p>
            <div class="flex gap-2">
                <button onclick="closeResetModal()" class="flex-1 py-2.5 rounded-xl font-bold text-xs text-slate-400 glass-panel hover:bg-slate-700/50">取消</button>
                <button onclick="resetMatch(); closeResetModal();" class="flex-1 py-2.5 rounded-xl font-bold text-xs text-slate-950 bg-pbNeon hover:bg-lime-300 shadow-lg shadow-pbNeon/20">開始新局</button>
            </div>
        </div>
    </div>

    <!-- 訊息提示 Toast -->
    <div id="toast" class="fixed bottom-12 left-1/2 -translate-x-1/2 glass-panel px-4 py-2 rounded-full text-xs font-bold text-pbRose border border-pbRose/40 opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="toastMsg">訊息內容</span>
    </div>

    <script>
        // 核心狀態管理 (維持兩隊原始身分，並追蹤誰是現任發球隊伍)
        const gameState = {
            team1: { name: '隊伍 1', score: 0, badge: 'T1' },
            team2: { name: '隊伍 2', score: 0, badge: 'T2' },
            servingTeamId: 1, // 當前擁有發球權的隊伍 ID (1 或 2)
            serverState: 2,   // 發球位 1 或 2 (局初為 2)
            isFirstServiceOfGame: true, // 局初開局標記 (只有發球員 2)
            isGameOver: false,
            soundEnabled: true
        };

        // Web Audio API 音效生成器
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!gameState.soundEnabled) return;
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'add') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'subtract') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(180, now + 0.12);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'toggle') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'sideout') {
                    // 換球權雙音特效
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(350, now);
                    osc.frequency.setValueAtTime(520, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const noteOsc = audioCtx.createOscillator();
                        const noteGain = audioCtx.createGain();
                        noteOsc.connect(noteGain);
                        noteGain.connect(audioCtx.destination);
                        
                        noteOsc.type = 'triangle';
                        noteOsc.frequency.setValueAtTime(freq, now + idx * 0.1);
                        noteGain.gain.setValueAtTime(0.2, now + idx * 0.1);
                        noteGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.3);
                        
                        noteOsc.start(now + idx * 0.1);
                        noteOsc.stop(now + idx * 0.1 + 0.3);
                    });
                }
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        function toggleSound() {
            gameState.soundEnabled = !gameState.soundEnabled;
            const icon = document.getElementById('soundIcon');
            if (gameState.soundEnabled) {
                icon.className = 'fa-solid fa-volume-high text-base sm:text-lg';
                playSound('toggle');
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-base sm:text-lg opacity-50';
            }
        }

        function setupSwipeGestures(cardElement, onSwipeUp, onSwipeDown) {
            let startY = 0;
            let currentY = 0;
            let isDragging = false;
            const threshold = 35;

            cardElement.addEventListener('touchstart', (e) => {
                if (gameState.isGameOver) return;
                startY = e.touches[0].clientY;
                currentY = startY;
                isDragging = true;
                cardElement.style.transition = 'none';
            }, { passive: true });

            cardElement.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                currentY = e.touches[0].clientY;
                const deltaY = currentY - startY;
                const dragOffset = Math.sin((deltaY / window.innerHeight) * Math.PI) * 100;
                cardElement.style.transform = `translateY(${dragOffset}px)`;
            }, { passive: true });

            cardElement.addEventListener('touchend', () => {
                if (!isDragging) return;
                isDragging = false;
                handleDragEnd();
            });

            cardElement.addEventListener('mousedown', (e) => {
                if (gameState.isGameOver) return;
                startY = e.clientY;
                currentY = startY;
                isDragging = true;
                cardElement.style.transition = 'none';
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                currentY = e.clientY;
                const deltaY = currentY - startY;
                const dragOffset = Math.sin((deltaY / window.innerHeight) * Math.PI) * 100;
                cardElement.style.transform = `translateY(${dragOffset}px)`;
            });

            window.addEventListener('mouseup', () => {
                if (!isDragging) return;
                isDragging = false;
                handleDragEnd();
            });

            function handleDragEnd() {
                const deltaY = currentY - startY;
                cardElement.style.transition = 'transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                cardElement.style.transform = 'translateY(0px)';

                if (deltaY < -threshold) {
                    onSwipeUp();
                } else if (deltaY > threshold) {
                    onSwipeDown();
                }
            }
        }

        // 左卡（發球方）分數增加
        function changeServingScore(delta) {
            if (gameState.isGameOver) return;
            const servingTeam = gameState.servingTeamId === 1 ? gameState.team1 : gameState.team2;
            const newScore = Math.max(0, servingTeam.score + delta);
            if (newScore !== servingTeam.score) {
                servingTeam.score = newScore;
                playSound(delta > 0 ? 'add' : 'subtract');
                updateUI();
                checkGameRules();
            }
        }

        // 中卡（接發球方）分數操作
        function handleReceivingSwipe(delta) {
            if (gameState.isGameOver) return;
            const receivingTeam = gameState.servingTeamId === 1 ? gameState.team2 : gameState.team1;
            
            if (delta > 0) {
                // 側邊球權制提醒
                showToast("匹克球側邊制：僅【發球方】能得分！");
            } else if (delta < 0) {
                // 扣回接發球方誤記之比分
                if (receivingTeam.score > 0) {
                    receivingTeam.score--;
                    playSound('subtract');
                    updateUI();
                }
            }
        }

        // 右卡（發球位點擊）：切換 1 ↔ 2 與觸發 Side-Out 換位
        function toggleServerState() {
            if (gameState.isGameOver) return;

            const card1 = document.getElementById('cardServing');
            const card2 = document.getElementById('cardReceiving');

            if (gameState.isFirstServiceOfGame) {
                // 開局第一次 Side-Out 直接換球權給隊伍 2
                gameState.isFirstServiceOfGame = false;
                gameState.servingTeamId = 2;
                gameState.serverState = 1;
                playSound('sideout');
                triggerCardSwapAnim(card1, card2);
            } else if (gameState.serverState === 2) {
                // 發球員 2 失敗 ➔ 轉為發球員 1 (Side-Out 換球權給另一隊)
                gameState.serverState = 1;
                gameState.servingTeamId = gameState.servingTeamId === 1 ? 2 : 1;
                playSound('sideout');
                triggerCardSwapAnim(card1, card2);
            } else {
                // 發球員 1 失敗 ➔ 轉為發球員 2 (同一隊換第二位發球員)
                gameState.serverState = 2;
                playSound('toggle');
            }

            updateUI();
        }

        function triggerCardSwapAnim(c1, c2) {
            c1.classList.add('card-swap-anim');
            c2.classList.add('card-swap-anim');
            setTimeout(() => {
                c1.classList.remove('card-swap-anim');
                c2.classList.remove('card-swap-anim');
            }, 400);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        function checkGameRules() {
            const s1 = gameState.team1.score;
            const s2 = gameState.team2.score;

            if ((s1 >= 11 || s2 >= 11) && Math.abs(s1 - s2) >= 2) {
                gameState.isGameOver = true;
                const winner = s1 > s2 ? gameState.team1.name : gameState.team2.name;
                triggerVictory(winner, `${s1} : ${s2}`);
            }
        }

        function triggerVictory(winnerName, scoreString) {
            playSound('win');
            
            document.getElementById('winnerText').innerText = `${winnerName} 獲勝！`;
            document.getElementById('finalScoreText').innerText = scoreString;

            const winModal = document.getElementById('winModal');
            const winCard = document.getElementById('winModalCard');
            winModal.classList.remove('opacity-0', 'pointer-events-none');
            winCard.classList.remove('scale-90');
            winCard.classList.add('scale-100');

            if (typeof confetti === 'function') {
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                setTimeout(() => {
                    confetti({ particleCount: 60, angle: 60, spread: 55, origin: { x: 0 } });
                    confetti({ particleCount: 60, angle: 120, spread: 55, origin: { x: 1 } });
                }, 250);
            }
        }

        function closeWinModal() {
            const winModal = document.getElementById('winModal');
            const winCard = document.getElementById('winModalCard');
            winCard.classList.remove('scale-100');
            winCard.classList.add('scale-90');
            winModal.classList.add('opacity-0', 'pointer-events-none');
        }

        function updateUI() {
            const servingTeam = gameState.servingTeamId === 1 ? gameState.team1 : gameState.team2;
            const receivingTeam = gameState.servingTeamId === 1 ? gameState.team2 : gameState.team1;

            // 渲染左卡 (Serving)
            document.getElementById('servingTeamName').innerText = servingTeam.name;
            document.getElementById('servingTeamBadge').innerText = servingTeam.badge;
            document.getElementById('servingScore').innerText = servingTeam.score;

            // 渲染中卡 (Receiving)
            document.getElementById('receivingTeamName').innerText = receivingTeam.name;
            document.getElementById('receivingTeamBadge').innerText = receivingTeam.badge;
            document.getElementById('receivingScore').innerText = receivingTeam.score;

            // 渲染右卡 (Server State)
            document.getElementById('serverStateDigit').innerText = gameState.serverState;

            // 呼叫口號 (ServerScore - ReceiverScore - Server#)
            document.getElementById('calloutText').innerText = `${servingTeam.score} - ${receivingTeam.score} - ${gameState.serverState}`;

            // Deuce 判斷 (雙方均 >= 10 分且差距未達 2 分)
            const isDeuce = (gameState.team1.score >= 10 && gameState.team2.score >= 10 && Math.abs(gameState.team1.score - gameState.team2.score) < 2);
            const deuceBadge = document.getElementById('deuceBadge');
            const gameNoticeBadge = document.getElementById('gameNoticeBadge');

            if (isDeuce) {
                deuceBadge.classList.remove('hidden');
                gameNoticeBadge.classList.add('hidden');
            } else {
                deuceBadge.classList.add('hidden');
                gameNoticeBadge.classList.remove('hidden');
            }
        }

        function editServingTeamName() {
            const servingTeam = gameState.servingTeamId === 1 ? gameState.team1 : gameState.team2;
            const newName = prompt(`請輸入 ${servingTeam.name} 的新名稱:`, servingTeam.name);
            if (newName && newName.trim() !== "") {
                servingTeam.name = newName.trim();
                updateUI();
            }
        }

        function editReceivingTeamName() {
            const receivingTeam = gameState.servingTeamId === 1 ? gameState.team2 : gameState.team1;
            const newName = prompt(`請輸入 ${receivingTeam.name} 的新名稱:`, receivingTeam.name);
            if (newName && newName.trim() !== "") {
                receivingTeam.name = newName.trim();
                updateUI();
            }
        }

        function confirmReset() {
            document.getElementById('resetConfirmModal').classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeResetModal() {
            document.getElementById('resetConfirmModal').classList.add('opacity-0', 'pointer-events-none');
        }

        function resetMatch() {
            gameState.team1.score = 0;
            gameState.team2.score = 0;
            gameState.servingTeamId = 1;
            gameState.serverState = 2;
            gameState.isFirstServiceOfGame = true;
            gameState.isGameOver = false;
            playSound('toggle');
            updateUI();
        }

        window.onload = function() {
            // 綁定左卡 (Serving) Swipe
            setupSwipeGestures(
                document.getElementById('cardServing'),
                () => changeServingScore(1),
                () => changeServingScore(-1)
            );

            // 綁定中卡 (Receiving) Swipe
            setupSwipeGestures(
                document.getElementById('cardReceiving'),
                () => handleReceivingSwipe(1),
                () => handleReceivingSwipe(-1)
            );

            // 綁定右卡 (ServerState) Click
            document.getElementById('cardServerState').addEventListener('click', () => {
                toggleServerState();
            });

            updateUI();
        };
    </script>
</body>
</html>
